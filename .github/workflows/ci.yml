# CI (SS25): anti-emoji (D1), typecheck, lint, tests y build en cada commit.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
      DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci'
      NEXTAUTH_SECRET: 'ci-secret'
      NEXTAUTH_URL: 'http://localhost:3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # D1: el build DEBE fallar si aparece un emoji en /src
      - run: npm run check:emoji
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npx prisma db push --skip-generate
      - run: npm run db:seed
      - run: npm run build
